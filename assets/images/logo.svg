<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#E5C378"/>
      <stop offset="100%" stop-color="#A7823E"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Elegant Emblem: Stylized Rose Petal & M Monogram -->
  <g transform="translate(15, 12)">
    <circle cx="33" cy="33" r="30" stroke="url(#goldGrad)" stroke-width="1.2" fill="#FAF6F0" opacity="0.9"/>
    <circle cx="33" cy="33" r="26" stroke="#EBDCD4" stroke-width="0.8" stroke-dasharray="2 3"/>
    <!-- Petal curves -->
    <path d="M33 13 C38 23 48 28 48 36 C48 45 41 51 33 51 C25 51 18 45 18 36 C18 28 28 23 33 13 Z" 
          fill="url(#goldGrad)" opacity="0.18"/>
    <!-- M Monogram inside emblem -->
    <path d="M24 43 L24 23 L33 34 L42 23 L42 43" 
          stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="33" cy="34" r="1.5" fill="#C5A059"/>
    <!-- Sparkle star -->
    <path d="M47 18 Q48 21 51 22 Q48 23 47 26 Q46 23 43 22 Q46 21 47 18 Z" fill="#C5A059"/>
  </g>

  <!-- Typography: MIDEVA COSMETICS -->
  <text x="96" y="44" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="4" fill="#2B1E1A">
    MIDEVA
  </text>
  <text x="98" y="64" font-family="'Plus Jakarta Sans', 'Montserrat', sans-serif" font-size="10.5" font-weight="500" letter-spacing="6" fill="#C5A059">
    COSMETICS • NAIROBI
  </text>
</svg>
